[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "techcorp-analytics"
version = "1.0.0"
description = "Modular SQLite Business Intelligence, CRUD lifecycle, and FastAPI service for TechCorp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.136.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "starlette==1.0.0",
    "uvicorn==0.44.0",
]

[project.optional-dependencies]
dev = [
    "flake8==7.3.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]
notebook = [
    "matplotlib==3.10.9",
    "pandas==3.0.2",
    "seaborn==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb", ".venv", "venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["techcorp_analytics"]
force-sort-within-sections = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
