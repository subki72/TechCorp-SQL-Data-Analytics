name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    name: Verify, Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.0.3 pytest-cov==7.1.0 build

      - name: Run automated verification suite
        run: python -m pytest tests/ -v --cov=src --cov-fail-under=75

      - name: Build Python distribution artifacts
        run: python -m build

      - name: Build container image
        run: docker build -t techcorp-analytics:${{ github.ref_name }} .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
